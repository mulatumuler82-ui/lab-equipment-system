<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Lab Equipment System</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <img src="https://via.placeholder.com/60x60/2c3e50/ffffff?text=IU" alt="University Logo">
                <h2>Reset Password</h2>
                <p>Enter your email to reset your password</p>
            </div>

            <form id="forgotPasswordForm" class="auth-form">
                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your registered email">
                    <small class="form-text">We'll send a password reset link to this email</small>
                </div>

                <div class="form-group">
                    <label for="role"><i class="fas fa-user-tag"></i> Account Role</label>
                    <select id="role" name="role" required>
                        <option value="">Select your role</option>
                        <option value="system_admin">System Administrator</option>
                        <option value="lab_assistant">Lab Assistant</option>
                        <option value="department_head">Department Head</option>
                        <option value="user">Student/Researcher/Faculty</option>
                        <option value="store_manager">Store Manager</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-paper-plane"></i> Send Reset Link
                </button>

                <div class="auth-footer">
                    <p>Remember your password? <a href="login.html">Login here</a></p>
                    <p><a href="index.html"><i class="fas fa-home"></i> Back to Home</a></p>
                </div>

                <div id="forgotPasswordMessage" class="message"></div>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
